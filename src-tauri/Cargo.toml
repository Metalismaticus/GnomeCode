[package]
name = "gnomecode"
version = "0.1.0"
edition = "2021"
description = "GnomeCode — desktop AI coding client over the OpenCode core"
authors = ["Metalismaticus"]

[lib]
name = "gnomecode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[profile.dev]
incremental = true
