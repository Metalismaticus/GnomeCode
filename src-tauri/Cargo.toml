[package]
name = "gnomecode"
version = "0.1.0"
edition = "2021"
description = "GnomeCode — desktop AI coding client over the OpenCode core"
authors = ["Metalismaticus"]

[lib]
name = "gnomecode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# Единственный выход в сеть — каталог плагинов на raw.githubusercontent (plugins/install.rs);
# блокирующий клиент с rustls, чтобы не тянуть асинхронный рантайм ради двух GET.
ureq = { version = "2", default-features = false, features = ["tls"] }
# Ключи провайдеров — Windows Credential Manager (кнопка настроек): движок и
# реестр файлы ключей не хранят. native без клона якорей — ради одной записи.
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[profile.dev]
incremental = true
